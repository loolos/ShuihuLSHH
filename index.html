<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>水浒传之梁山好汉 · 重制</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" hidden>
      <select id="stage" aria-label="关卡"></select>
      <span id="turn"></span>
      <span id="team-exp" title="全队经验池：击倒敌人所得经验的 35% 存在这里，胜利后分给本关出场的人（先补等级最落后的）"></span>
      <button id="objective-btn">目标</button>
      <button id="zoom-out" aria-label="缩小">－</button>
      <button id="zoom-in" aria-label="放大">＋</button>
      <button id="rewind" title="时光倒流：回到回合开始时的状态" disabled>时光倒流</button>
      <button id="end-turn" class="primary">回合终了</button>
      <button id="sound" title="音效音量">♪中</button>
      <button id="music" title="背景音乐">音乐开</button>
      <button id="update" title="检查有没有新版本">检查更新</button>
      <button id="reset" title="清除缓存，重新选择原版目录">更换目录</button>
    </div>
    <div id="bottom" hidden>
      <div id="log"></div>
      <div id="unit-panel" hidden></div>
      <div id="cmd" hidden></div>
    </div>
    <div id="cmd-float" hidden></div>
    <div id="minimap" hidden></div>
    <div id="dialog" hidden>
      <div id="dialog-who"></div>
      <div id="dialog-text"></div>
      <button id="dialog-skip" type="button" title="Esc">跳过 ▸▸</button>
      <div id="dialog-hint">点击任意处继续 ▸</div>
    </div>
    <div id="result" hidden>
      <div class="panel">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <div id="result-actions"></div>
      </div>
    </div>
    <div id="unit-pick" hidden>
      <div class="panel">
        <h2 id="unit-pick-title"></h2>
        <p id="unit-pick-hint"></p>
        <div id="unit-pick-list"></div>
        <button id="unit-pick-ok" type="button">确定</button>
      </div>
    </div>
    <div id="toast" role="status" hidden><span id="toast-text"></span><span id="toast-actions"></span></div>
    <div id="town" hidden></div>
    <div id="setup">
      <div class="panel">
        <h1>水浒传之梁山好汉</h1>
        <p class="sub">网页重制版 · 首次打开会从 GitHub 下载原版文件（每关只下载本关用到的素材）</p>
        <p id="setup-msg">正在检查本地缓存…</p>
        <div class="bar"><div id="setup-bar"></div></div>
        <div id="setup-actions" hidden>
          <button id="pick">选择原版游戏目录</button>
          <input id="pick-input" type="file" webkitdirectory multiple hidden />
          <p class="hint">请选择含有 <code>ShuiHu.exe</code>、<code>Data</code>、<code>Map</code> 的目录。文件只在你的浏览器里读取，不会上传。</p>
        </div>
        <div id="setup-warn" hidden>
          <p id="setup-warn-text"></p>
          <button id="continue">仍然继续</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
